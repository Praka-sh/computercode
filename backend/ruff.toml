[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default argument values (common pattern)
    "T201",  # print statements (allowed for debug)
]
per-file-ignores = {
    "tests/*": ["S101", "T201"],
    "alembic/*": ["E501"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.isort]
known-first-party = ["app"]
import-headings = [
    "STANDARD_LIBRARY",
    "THIRD_PARTY",
    "FIRST_PARTY",
]